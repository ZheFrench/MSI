# Cromwell settings (Slurm + Apptainer), for both modes: BASH.msi_detection.cron.sh
# and companion-scripts/BASH.msi_detection.batch.sh run Cromwell from their own
# $SCRATCH_DIR/Cromwell/, so the relative paths below (executions, call cache
# database) give one of each per mode.
#   java -Dconfig.file=backends.conf/cromwell.conf -jar cromwell-92.jar run ...
# Data folders outside a task's own folder (the run directory, the BAMs, the
# references when soft-linked) must be visible in the containers: the
# launcher exports APPTAINER_BIND, which sbatch passes on to apptainer.
# Images: the launcher exports MSI_CONTAINERS_DIR, the folder of the .sif files.

include required(classpath("application"))

backend {
  default = "SlurmApptainer"
  providers {
    SlurmApptainer {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        root = "cromwell-executions"
        # Jobs (sbatch) running at the same time.
        concurrent-job-limit = 50

        # runtime { cpu, memory, apptainer } of the tasks; memory is converted
        # to memory_mb by Cromwell. The image is the custom attribute apptainer,
        # not container/docker: Cromwell 92 fails to hand those to a config
        # backend under WDL 1.1 (issue #7846, fixed after 92: back to container
        # then, with submit-docker).
        runtime-attributes = """
          Int cpu = 1
          Int memory_mb = 2048
          String apptainer
        """

        # Images are named Docker-style, <name>:<tag> (params/install.json), run
        # from $MSI_CONTAINERS_DIR/<name>-<tag>.sif (case ignored, e.g.
        # python-msi:3.12 -> python-MSI-3.12.sif). The task folder is bound at
        # its own path: paths are the same inside the container.
        submit = """
          sif=$(find "$MSI_CONTAINERS_DIR" -maxdepth 1 -iname "$(echo '${apptainer}' | tr : -).sif" | head -n 1)
          # No braces here: Cromwell reads these scripts as WDL draft-2 commands.
          if [ -z "$sif" ]; then echo "No image for ${apptainer} in $MSI_CONTAINERS_DIR" >&2; exit 1; fi
          sbatch -J msi-${job_name} -D ${cwd} -o ${out} -e ${err} \
            --partition=prod -c ${cpu} --mem=${memory_mb}M \
            --wrap "apptainer exec --cleanenv --bind ${cwd} $sif /bin/bash ${script}"
        """
        kill = "scancel ${job_id}"
        check-alive = "squeue -j ${job_id}"
        job-id-regex = "Submitted batch job (\\d+).*"
        # A job gone from squeue without its rc file is failed after this many seconds.
        exit-code-timeout-seconds = 120

        filesystems {
          local {
            # Hard link when on the same filesystem (no bind needed), else a
            # soft link (its target must be bound, see APPTAINER_BIND above).
            localization = ["hard-link", "soft-link", "copy"]
            caching {
              duplication-strategy = ["hard-link", "soft-link", "copy"]
              # Size + modification time, not an md5 of every BAM and genome.
              hashing-strategy = "fingerprint"
            }
          }
        }
      }
    }
  }
}

# The call cache, kept from one run to the next in the database below: the
# genome scan (tb01_sensorpro_scan) is not redone, as long as the run folder
# that computed it is kept.
call-caching {
  enabled = true
  invalidate-bad-cache-results = true
}
# The image name (apptainer attribute) enters the call cache key, not the .sif
# content: a rebuilt .sif needs a new tag.

# Per-workflow log, kept: workflow.<id>.log holds only that run's lines, without
# Cromwell's start-up (database, HSQLDB checkpoints) that fills cromwell.log.
workflow-options {
  workflow-log-dir = "cromwell-executions/workflow-logs"
  workflow-log-temporary = false
}

# File database (HSQLDB) instead of the in-memory default, for the call cache.
database {
  profile = "slick.jdbc.HsqldbProfile$"
  db {
    driver = "org.hsqldb.jdbcDriver"
    url = "jdbc:hsqldb:file:cromwell-db/cromwell-db;shutdown=false;hsqldb.default_table_type=cached;hsqldb.tx=mvcc;hsqldb.result_max_memory_rows=10000;hsqldb.large_data=true;hsqldb.applog=1;hsqldb.lob_compressed=true;hsqldb.script_format=3"
    connectionTimeout = 120000
    numThreads = 1
  }
}
