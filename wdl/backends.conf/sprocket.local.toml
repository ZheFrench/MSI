# Development: Slurm + Apptainer on this workstation (single-node Slurm
# installed by slurm-local/install.sh), same backend as production with local
# paths. Default config of BASH.sprocket.sh.
[run]
backend = "slurm"
# Required by the slurm_apptainer backend (experimental in sprocket).
experimental_features_enabled = true

[run.backends.slurm]
type = "slurm_apptainer"
job_name_prefix = "msi"
# Seconds between two sacct polls of the running jobs (short: local tests).
interval = 5

[run.backends.slurm.sbatch]
args = ["--partition=prod"]

[run.backends.slurm.apptainer]
executable = "apptainer"
image_cache_dir = "/media/jp/SSD2/CHU/test/apptainer_cache"

[run.task]
cache = "on"
digests = "strongish"
cache_dir = "/media/jp/SSD2/CHU/test/work/sprocket_cache"